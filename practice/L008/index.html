<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading your practice sheet...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #f8f9fa; color: #1a1a1a; }
    .card { background: white; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 400px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb;
               border-top-color: #EF4444; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 0.9rem; }
    .brand { font-size: 0.75rem; color: #9ca3af; margin-top: 24px; }
  </style>
  <!-- GoatCounter: privacy-friendly, free, no cookies, GDPR compliant -->
  <script data-goatcounter="https://ondutyenglish.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Your practice sheet is downloading...</h2>
    <p>Patient Admission & Handoff English for Nurses</p>
    <div class="brand">On Duty English — Free Practice Sheets</div>
  </div>
  <script>
    (function() {
      var pdfUrl = 'L008_practice_sheet.pdf';
      // Fire GoatCounter event for this specific lesson download
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({
          path: '/practice/L008/download',
          title: 'Practice Sheet Download — L008',
          event: true
        });
      }
      // Redirect to PDF after short delay
      setTimeout(function() { window.location.href = pdfUrl; }, 800);
    })();
  </script>
</body>
</html>
